# Single-instance layout (simplest: one Odoo server).
# Copy to config.yaml (~/.config/odoo-cli/config.yaml) or pass with --config,
# or skip the file entirely and use ODOO_URL / ODOO_DB / ODOO_USERNAME env
# vars instead. The file holds NON-SECRET fields only: the secret (API key or
# password) lives in the OS keychain (service "cli-odoo") and is stored by
# `odoo login`. File/env secret keys do not exist.
url: https://odoo.example.com
db: mydb
username: admin
transport: xmlrpc   # xmlrpc (default, Odoo 17 compatible) | json2 (opt-in, Odoo 19+ only)
timeout: 30         # seconds
verify_ssl: true
lang: en_US         # also accepted as `locale`; env override: ODOO_LOCALE

