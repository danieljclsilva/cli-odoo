version: 2

project_name: odoo

before:
  hooks:
    - go mod tidy

builds:
  - id: odoo
    binary: odoo
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # windows/arm64 is not a supported release target
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X github.com/danieljclsilva/cli-odoo/cmd.Version={{ .Version }}

archives:
  - id: default
    name_template: "{{ .Binary }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - ^docs:
      - ^test:
